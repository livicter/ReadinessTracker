name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS unit tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Resolve simulator destination
        id: dest
        run: |
          set -euo pipefail
          # Pick the first available iPhone; prefer Pro models when present.
          NAME="$(xcrun simctl list devices available \
            | awk -F'[()]' '/iPhone/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}' \
            | grep -E 'iPhone (16|17)' \
            | head -1 || true)"
          if [[ -z "$NAME" ]]; then
            NAME="$(xcrun simctl list devices available \
              | awk -F'[()]' '/iPhone/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}')"
          fi
          if [[ -z "$NAME" ]]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          DEST="platform=iOS Simulator,name=${NAME}"
          echo "destination=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Using: $DEST"

      - name: Run unit tests
        env:
          DESTINATION: ${{ steps.dest.outputs.destination }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ci-result.xcresult
        run: ./scripts/ci-verify.sh

      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/ci-result.xcresult
          if-no-files-found: ignore
